# Blueprint do Render: cria o banco e o site de uma vez.
# Painel do Render → New → Blueprint → escolher este repositório.
#
# PLANOS: começa tudo no gratuito para testar. ANTES de cadastrar dados reais,
# troque o banco para um plano pago no painel — o Postgres gratuito é APAGADO
# 30 dias após a criação (+14 dias de carência), com todos os dados.
# O site gratuito "dorme" após 15 min sem acesso (o 1º acesso leva ~1 min).

databases:
  - name: planometas-db
    databaseName: planometas
    user: planometas
    plan: free
    region: virginia          # sem região no Brasil; Virginia é a de menor latência
    postgresMajorVersion: "16"
    ipAllowList: []           # nenhum acesso externo: só o site (rede privada) conecta

services:
  - type: web
    name: plano-de-metas
    runtime: node
    plan: free
    region: virginia          # precisa ser a mesma do banco (rede privada)
    buildCommand: npm ci --include=dev && npm run build   # build = prisma generate + next build
    # `npm run start` = migrate deploy (idempotente, nunca apaga dados) + seed
    # --producao (só age em banco vazio) + next start. Fica no start porque
    # preDeployCommand só existe em planos pagos. Ver package.json.
    startCommand: npm run start
    healthCheckPath: /login
    autoDeployTrigger: commit
    # AUTH_TRUST_HOST e o IP do visitante (1º item do X-Forwarded-For) são
    # configurados automaticamente pelo código ao detectar RENDER=true.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: planometas-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # Senha do 1º login (prefeito@uba.mg.gov.br). O Render pede o valor ao
      # criar o Blueprint (12 a 72 caracteres). Só é usada quando o banco está
      # vazio; depois do 1º acesso pode ser apagada do painel.
      - key: SENHA_INICIAL_ADMIN
        sync: false
